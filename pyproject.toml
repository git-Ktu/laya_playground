[project]
name = "laya-playground"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["laya[serve]==0.3.22", "torch==2.7.1+cu126"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.63.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: explicitly run real model tests"]
addopts = "-m 'not integration'"
