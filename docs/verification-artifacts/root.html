<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Laya Playground</title><link rel="stylesheet" href="/static/playground.css"><script src="/static/playground.js" defer></script></head>
<body><header><div><h1>Laya Playground</h1><p>日本語の文章から、選択・評価・判定を試す。</p></div><p id="model-status" role="status">モデル情報を確認中…</p></header>
<main><section class="editor" aria-label="入力"><div class="section-heading"><h2>状態</h2><label>入力形式 <select id="state-format"><option value="text">Plain text</option><option value="json">JSON</option></select></label></div><label for="state">判断に使う文章・データ</label><textarea id="state" rows="7">新しいノートパソコンを購入しました。画面が見やすく、持ち運びも快適です。ただ、バッテリーの持ちはもう少し改善してほしいです。</textarea><p id="state-count" role="status"></p><p id="token-warning" class="warning" role="status"></p>
<div class="section-heading"><h2>質問</h2><button id="add-question" type="button">質問を追加</button></div><div id="questions"></div>
<div class="run-row"><button id="run" class="primary" type="button">Run</button><span>Ctrl + Enter で実行</span></div><p id="error" class="error" role="alert" hidden></p>
<details class="request"><summary>API リクエスト</summary><label for="origin">接続先 origin</label><input id="origin" type="url"><p id="origin-help"></p><div class="copy-row"><button id="copy-json">JSON をコピー</button><button id="copy-curl">curl をコピー</button></div><p id="copy-status" role="status"></p><pre id="request-preview"></pre></details></section>
<section class="results" aria-label="結果"><div class="section-heading"><h2>結果</h2><span id="result-status" role="status">実行待ち</span></div><p id="empty-result">状態と質問を編集して Run を押すと、質問ごとの判断と確率を表示します。</p><p id="result-meta"></p><p id="result-warning" class="warning" role="status"></p><div id="answers"></div><details id="raw-details" hidden><summary>Raw JSON</summary><pre id="raw-json"></pre></details></section></main>
<footer>convaiinnovations/laya-multilingual <span>最大 8192 state tokens。質問を含む入力では切り捨てが発生する場合があります。</span></footer></body></html>
